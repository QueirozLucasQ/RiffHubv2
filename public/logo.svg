<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!-- Purple R/bookmark shape -->
  <defs>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B3FE4"/>
      <stop offset="100%" stop-color="#5B2DB0"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B9EFF"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Main body: bookmark/R shape -->
  <path d="M20 10 L160 10 Q180 10 180 30 L180 120 Q180 140 160 140 L110 140 L160 200 L120 200 L70 140 L20 140 Z"
    fill="url(#purpleGrad)" filter="url(#shadow)"/>

  <!-- Dark inner cutout to shape the R leg -->
  <path d="M50 30 L140 30 Q155 30 155 45 L155 80 Q155 95 140 95 L50 95 Z"
    fill="#1A0A40" opacity="0.3"/>

  <!-- Heartbeat / waveform line in white -->
  <polyline
    points="25,90 50,90 65,55 78,125 92,72 105,105 118,90 160,90"
    stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Blue share icon (3 circles + lines) -->
  <circle cx="155" cy="75" r="18" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <circle cx="130" cy="110" r="13" fill="url(#blueGrad)" opacity="0.9"/>
  <circle cx="155" cy="140" r="13" fill="url(#blueGrad)" opacity="0.9"/>
  <line x1="155" y1="93" x2="133" y2="110" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="133" y1="112" x2="153" y2="130" stroke="white" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Highlight dots on share circles -->
  <circle cx="155" cy="75" r="5" fill="white" opacity="0.4"/>
  <circle cx="130" cy="110" r="3" fill="white" opacity="0.4"/>
  <circle cx="155" cy="140" r="3" fill="white" opacity="0.4"/>
</svg>
